[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-m3m"
version = "0.3.0"
description = "Local-first persistent memory for AI coding agents with Markdown as Source of Truth"
readme = "README.md"
authors = [{ name = "Bello" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
  "ai", "agents", "memory", "markdown", "preview-environment", "mcp",
  "claude", "codex", "opencode", "persistent-memory",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage>=7.6",
  "ruff>=0.4",
  "twine>=5.1",
]

[project.scripts]
m3m = "agent_m3m.cli:main"
agent-m3m = "agent_m3m.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Runtime-error subset so CI catches real breakage without style churn.
select = ["E9", "F63", "F7", "F82"]
