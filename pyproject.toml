[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-m3m"
version = "0.1.0"
description = "Local-first persistent memory for AI coding agents with Markdown as Source of Truth"
readme = "README.md"
authors = [{ name = "Bello", email = "bello@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-m3m = "agent_m3m.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
